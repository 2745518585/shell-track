name: Release Windows packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      publish:
        description: Publish a GitHub Release (false builds verified artifacts only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      msix_version: ${{ steps.version.outputs.msix_version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and tag on the default branch
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:DISPATCH_REF -ne $env:DEFAULT_BRANCH) {
            throw 'Manual release runs must use the default branch workflow.'
          }
          $version = ./scripts/release-version.ps1 -Tag $env:RELEASE_TAG
          $commit = git rev-parse --verify "refs/tags/$($version.tag)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'The version tag must already exist.' }
          git merge-base --is-ancestor $commit "origin/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Only commits merged into the default branch can be released.' }
          @("tag=$($version.tag)", "version=$($version.version)", "msix_version=$($version.msixVersion)", "commit=$commit") |
            Add-Content -LiteralPath $env:GITHUB_OUTPUT

  build:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      MSIX_VERSION: ${{ needs.validate.outputs.msix_version }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      TIMESTAMP_URL: ${{ vars.SHELLTRACK_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Release builds do not restore a cache populated by pull requests.
      - name: Build and test the tagged source
        run: |
          ./scripts/test-release.ps1
          ./scripts/test-release-signing.ps1
          ./scripts/build.ps1 -Configuration Release
          ./scripts/test.ps1 -Configuration Release -NoBuild
      - name: Publish versioned self-contained bundle
        run: ./scripts/publish.ps1 -SelfContained -Version $env:RELEASE_VERSION -OutputDirectory artifacts/release-bundle
      - name: Verify portable bundle
        run: ./scripts/verify-bundle.ps1 -BundleDirectory artifacts/release-bundle
      - name: Prepare verified Inno Setup compiler
        run: |
          ./scripts/install-packaging-tools.ps1
          ./scripts/test-packaging-tools.ps1
      - name: Import persistent release signing certificate
        id: signing
        env:
          SHELLTRACK_SIGNING_PFX_BASE64: ${{ secrets.SHELLTRACK_SIGNING_PFX_BASE64 }}
          SHELLTRACK_SIGNING_PFX_PASSWORD: ${{ secrets.SHELLTRACK_SIGNING_PFX_PASSWORD }}
          SHELLTRACK_SIGNING_THUMBPRINT: ${{ vars.SHELLTRACK_SIGNING_THUMBPRINT }}
        run: ./scripts/import-release-certificate.ps1
      - name: Sign application binaries and build signed installers
        env:
          SIGNING_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: |
          ./scripts/sign-release-bundle.ps1 -BundleDirectory artifacts/release-bundle -CertificateThumbprint $env:SIGNING_THUMBPRINT -TimestampUrl $env:TIMESTAMP_URL
          ./scripts/build-installers.ps1 -BundleDirectory artifacts/release-bundle -OutputDirectory artifacts/release-installers -Version $env:MSIX_VERSION -CertificateThumbprint $env:SIGNING_THUMBPRINT -TimestampUrl $env:TIMESTAMP_URL
      - name: Verify signed installers and installed application
        run: ./scripts/verify-installers.ps1 -InstallerDirectory artifacts/release-installers
      - name: Create portable ZIP and release checksums
        run: |
          ./scripts/create-release-assets.ps1 -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT -BundleDirectory artifacts/release-bundle -InstallerDirectory artifacts/release-installers -OutputDirectory artifacts/release
          ./scripts/verify-release-assets.ps1 -Directory artifacts/release -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT
      - name: Attest build provenance for all release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: artifacts/release/SHA256SUMS.txt
      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.validate.outputs.tag }}
          path: artifacts/release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Remove release private key from the runner
        if: always() && steps.signing.outputs.thumbprint != ''
        env:
          SIGNING_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: Remove-Item -LiteralPath "Cert:/CurrentUser/My/$env:SIGNING_THUMBPRINT" -DeleteKey -ErrorAction Stop

  publish:
    needs: [validate, build]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.validate.outputs.tag }}
          path: artifacts/release
      - name: Recheck downloaded release assets
        shell: pwsh
        run: ./scripts/verify-release-assets.ps1 -Directory artifacts/release -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT
      - name: Verify provenance and publish the complete release
        shell: bash
        run: |
          set -euo pipefail
          # Never overwrite a published release or an existing draft.
          gh api --paginate --slurp "repos/$GH_REPO/releases" --jq 'add' > "$RUNNER_TEMP/releases.json"
          if jq -e --arg tag "$RELEASE_TAG" 'any(.[]; .tag_name == $tag)' "$RUNNER_TEMP/releases.json" > /dev/null; then
            echo "Release already exists. Inspect/remove an incomplete draft before retrying; published versions need a new tag." >&2
            exit 1
          fi
          remote_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          test "$remote_commit" = "$RELEASE_COMMIT"
          while read -r _ filename; do
            gh attestation verify "artifacts/release/$filename" --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml" --deny-self-hosted-runners
          done < artifacts/release/SHA256SUMS.txt
          remote_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          test "$remote_commit" = "$RELEASE_COMMIT"
          gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --target "$RELEASE_COMMIT" --draft --title "Shell Track $RELEASE_TAG" --generate-notes --notes "Windows x64: portable ZIP, EXE installer and MSIX. See INSTALL.md for certificate trust and installation; SHA256SUMS.txt and release.json identify this build."
          # Uploads finish before publication, compatible with immutable releases.
          gh release edit "$RELEASE_TAG" --draft=false
